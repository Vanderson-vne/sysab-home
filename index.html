<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Site em Construção</title>
  <meta name="facebook-domain-verification" content="j8ql0srpw7q57sq7va0n7wixp0td9u" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #111827, #1f2937, #374151);
      color:white;
      overflow:hidden;
    }

    .container{
      text-align:center;
      padding:40px;
      width:90%;
      max-width:600px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius:20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: fadeIn 1.5s ease;
    }

    .logo{
      font-size:42px;
      font-weight:bold;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    h1{
      font-size:38px;
      margin-bottom:15px;
    }

    p{
      font-size:18px;
      color:#d1d5db;
      line-height:1.6;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:14px 28px;
      background:#f59e0b;
      color:#111827;
      text-decoration:none;
      font-weight:bold;
      border-radius:50px;
      transition:0.3s;
    }

    .btn:hover{
      background:#ffffff;
      transform:scale(1.05);
    }

    .loader{
      margin:25px auto;
      width:60px;
      height:60px;
      border:6px solid rgba(255,255,255,0.2);
      border-top:6px solid #f59e0b;
      border-radius:50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    footer{
      margin-top:30px;
      font-size:14px;
      color:#9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">POWER SOFTWARE</div>

    <h1>🚧 Site em Construção</h1>

    <p>
      Estamos preparando algo incrível para você.<br>
      Em breve nosso novo site estará no ar com muitas novidades.
    </p>

    <div class="loader"></div>

    <!-- <a href="https://wa.me/5511986044826" class="btn"> -->
    <a href="https://syspower.smallbio.com.br/" class="btn">
      Fale Conosco
    </a>

    <footer>
      © 2026 - Todos os direitos reservados
    </footer>
  </div>

</body>
</html>
